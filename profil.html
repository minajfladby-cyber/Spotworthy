<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil — spotworthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

<header class="app-topbar">
  <a href="index.html" class="logo">
    <span class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c.6 5.4 1.2 8.4 10 10-8.8 1.6-9.4 4.6-10 10-.6-5.4-1.2-8.4-10-10 8.8-1.6 9.4-4.6 10-10Z" fill="var(--cream)"/>
      </svg>
    </span>
    spotworthy
  </a>
  <span class="app-topbar-title">Profil</span>
</header>

<main class="app-main">
  <div class="profile-header">
    <label class="avatar-upload" for="avatar-input">
      <img id="avatar-img" src="" alt="" hidden>
      <span id="avatar-placeholder">+</span>
      <input type="file" id="avatar-input" accept="image/*" hidden>
    </label>
    <h2 id="profile-username">@brukernavn</h2>
    <p id="profile-name" class="profile-name"></p>
  </div>

  <label class="field-label" for="username-input">Brukernavn <span class="char-hint" id="username-hint"></span></label>
  <input class="text-input" id="username-input" type="text">

  <label class="field-label" for="bio-input">Bio <span class="char-hint" id="bio-count">0/100</span></label>
  <textarea class="text-input" id="bio-input" maxlength="100" rows="3" placeholder="Skriv noe kort om deg selv..."></textarea>

  <div class="setting-row">
    <div>
      <strong>Privat profil</strong>
      <p>Nye følgere må godkjennes før de kan se anmeldelsene dine.</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="private-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn btn-primary auth-submit" id="save-profile">Lagre profil</button>
  <button class="btn btn-outline auth-submit" id="logout-btn">Logg ut</button>

  <h3 class="my-posts-title">Mine innlegg</h3>
  <div id="my-posts" class="feed-list"></div>
</main>

<nav class="bottom-nav">
  <a href="feed.html" class="bottom-nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Feed</span>
  </a>

  <button type="button" class="bottom-nav-item" id="search-trigger">
    <span class="nav-icon-wrap">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="nav-badge" hidden></span>
    </span>
    <span>Søk</span>
  </button>

  <button type="button" class="bottom-nav-fab" id="create-post-trigger" aria-label="Nytt innlegg">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <a href="profil.html" class="bottom-nav-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8.5" r="3.3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5 20c0-3.6 3.13-6.5 7-6.5s7 2.9 7 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>Profil</span>
  </a>
</nav>

<!-- SEARCH SHEET -->
<div class="sheet-overlay" id="search-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Venner</h3>
      <button class="modal-close" id="search-close" aria-label="Lukk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="tab-bar">
      <button type="button" class="tab-btn active" data-tab="search">Søk</button>
      <button type="button" class="tab-btn" data-tab="requests">Forespørsler <span class="tab-badge" id="requests-badge" hidden>0</span></button>
    </div>
    <div class="tab-panel" data-panel="search">
      <input type="text" id="search-input" class="text-input" placeholder="Søk navn eller brukernavn">
      <div id="search-results" class="search-results"></div>
    </div>
    <div class="tab-panel" data-panel="requests" hidden>
      <div id="requests-list" class="search-results"></div>
    </div>
  </div>
</div>

<!-- CREATE POST SHEET -->
<div class="sheet-overlay" id="create-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Nytt innlegg</h3>
      <button class="modal-close" id="create-close" aria-label="Lukk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <form id="create-form">
      <label class="field-label">Bilde</label>
      <label class="photo-upload" for="post-photo">
        <input type="file" id="post-photo" accept="image/*" hidden>
        <span id="photo-preview-text">Trykk for å legge til bilde fra stedet</span>
        <img id="photo-preview-img" hidden alt="">
      </label>

      <label class="field-label">Vurdering</label>
      <div class="star-picker" id="star-picker">
        <button type="button" class="star-btn" data-star="1">★</button>
        <button type="button" class="star-btn" data-star="2">★</button>
        <button type="button" class="star-btn" data-star="3">★</button>
        <button type="button" class="star-btn" data-star="4">★</button>
        <button type="button" class="star-btn" data-star="5">★</button>
      </div>

      <label class="field-label" for="post-text">Tekst <span class="char-hint" id="char-count">0/100</span></label>
      <textarea class="text-input" id="post-text" maxlength="100" rows="3" placeholder="Hva syntes du om stedet?"></textarea>

      <label class="field-label" for="post-address">Adresse (valgfritt)</label>
      <input class="text-input" id="post-address" type="text" placeholder="F.eks. Karl Johans gate 1, Oslo">
      <p class="field-hint">Skriv en ekte adresse — da fungerer kartpinnen på innlegget.</p>

      <label class="field-label">Merkelapper (valgfritt)</label>
      <div class="tag-picker" id="tag-picker">
        <button type="button" class="tag-chip" data-tag="kaffe">Kaffe</button>
        <button type="button" class="tag-chip" data-tag="cappuccino">Cappuccino</button>
        <button type="button" class="tag-chip" data-tag="latte">Caffe latte</button>
        <button type="button" class="tag-chip" data-tag="pizza">Pizza</button>
        <button type="button" class="tag-chip" data-tag="burger">Burger</button>
        <button type="button" class="tag-chip" data-tag="sushi">Sushi</button>
        <button type="button" class="tag-chip" data-tag="milkshake">Milkshake</button>
        <button type="button" class="tag-chip" data-tag="brunsj">Brunsj</button>
        <button type="button" class="tag-chip" data-tag="dessert">Dessert</button>
        <button type="button" class="tag-chip" data-tag="salat">Salat</button>
      </div>
      <div class="custom-tag-row">
        <input type="text" id="custom-tag-input" class="text-input" placeholder="Legg til eget matord (f.eks. taco)">
        <button type="button" class="btn btn-outline btn-sm" id="add-custom-tag">Legg til</button>
      </div>
      <div class="custom-tags" id="custom-tags-list"></div>

      <label class="field-label">Synlighet</label>
      <div class="visibility-toggle" id="visibility-toggle">
        <button type="button" class="vis-btn active" data-vis="offentlig">Offentlig</button>
        <button type="button" class="vis-btn" data-vis="venner">Kun venner</button>
      </div>

      <button type="submit" class="btn btn-primary btn-lg auth-submit">Publiser</button>
    </form>
  </div>
</div>

<!-- IMAGE CROP -->
<div class="crop-overlay" id="crop-overlay">
  <div class="crop-box">
    <h3>Tilpass bildet</h3>
    <div class="crop-viewport" id="crop-viewport">
      <img id="crop-image" alt="">
    </div>
    <input type="range" id="crop-zoom" class="crop-zoom" min="1" max="3" step="0.01" value="1">
    <div class="crop-actions">
      <button type="button" class="btn btn-outline" id="crop-cancel">Avbryt</button>
      <button type="button" class="btn btn-primary" id="crop-confirm">Bruk bilde</button>
    </div>
  </div>
</div>

<!-- PHOTO LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox-overlay">
  <button class="lightbox-close" id="lightbox-close" aria-label="Lukk">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <img id="lightbox-image" src="" alt="">
</div>

<script type="module" src="app.js"></script>
</body>
</html>
