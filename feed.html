<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feed — spotworthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="app-body">

<header class="app-topbar">
  <a href="index.html" class="logo">
    <span class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c.6 5.4 1.2 8.4 10 10-8.8 1.6-9.4 4.6-10 10-.6-5.4-1.2-8.4-10-10 8.8-1.6 9.4-4.6 10-10Z" fill="var(--cream)"/>
      </svg>
    </span>
    spotworthy
  </a>
  <span class="app-topbar-title">Feed</span>
</header>

<main class="app-main">
  <div id="feed-empty" class="empty-state">
    <div class="empty-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="3" width="16" height="18" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8.5 17.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h2>Ingen anmeldelser enda</h2>
    <p>Følg venner for å se hva de anbefaler, eller trykk på + nederst for å legge ut din egen første anmeldelse.</p>
  </div>
  <div id="feed-list" class="feed-list"></div>
</main>

<nav class="bottom-nav">
  <a href="feed.html" class="bottom-nav-item active">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Feed</span>
  </a>

  <button type="button" class="bottom-nav-item" id="search-trigger">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
      <path d="m20 20-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>Søk</span>
  </button>

  <button type="button" class="bottom-nav-fab" id="create-post-trigger" aria-label="Nytt innlegg">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <a href="profil.html" class="bottom-nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8.5" r="3.3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5 20c0-3.6 3.13-6.5 7-6.5s7 2.9 7 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>Profil</span>
  </a>
</nav>

<!-- SEARCH SHEET -->
<div class="sheet-overlay" id="search-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Søk venner</h3>
      <button class="modal-close" id="search-close" aria-label="Lukk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <input type="text" id="search-input" class="text-input" placeholder="Søk navn eller brukernavn">
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<!-- CREATE POST SHEET -->
<div class="sheet-overlay" id="create-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Nytt innlegg</h3>
      <button class="modal-close" id="create-close" aria-label="Lukk">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <form id="create-form">
      <label class="field-label">Bilde</label>
      <label class="photo-upload" for="post-photo">
        <input type="file" id="post-photo" accept="image/*" hidden>
        <span id="photo-preview-text">Trykk for å legge til bilde fra stedet</span>
        <img id="photo-preview-img" hidden alt="">
      </label>

      <label class="field-label">Vurdering</label>
      <div class="star-picker" id="star-picker">
        <button type="button" class="star-btn" data-star="1">★</button>
        <button type="button" class="star-btn" data-star="2">★</button>
        <button type="button" class="star-btn" data-star="3">★</button>
        <button type="button" class="star-btn" data-star="4">★</button>
        <button type="button" class="star-btn" data-star="5">★</button>
      </div>

      <label class="field-label" for="post-text">Tekst <span class="char-hint" id="char-count">0/100</span></label>
      <textarea class="text-input" id="post-text" maxlength="100" rows="3" placeholder="Hva syntes du om stedet?"></textarea>

      <label class="field-label" for="post-address">Adresse (valgfritt)</label>
      <input class="text-input" id="post-address" type="text" placeholder="F.eks. Kafe Solvang, Oslo">

      <label class="field-label">Synlighet</label>
      <div class="visibility-toggle" id="visibility-toggle">
        <button type="button" class="vis-btn active" data-vis="offentlig">Offentlig</button>
        <button type="button" class="vis-btn" data-vis="venner">Kun venner</button>
      </div>

      <button type="submit" class="btn btn-primary btn-lg auth-submit">Publiser</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
