<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logg inn — spotworthy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <a href="index.html" class="logo auth-logo">
    <span class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2c.6 5.4 1.2 8.4 10 10-8.8 1.6-9.4 4.6-10 10-.6-5.4-1.2-8.4-10-10 8.8-1.6 9.4-4.6 10-10Z" fill="var(--cream)"/>
      </svg>
    </span>
    spotworthy
  </a>

  <div class="auth-card">
    <h1>Logg inn</h1>
    <p class="auth-sub">Bra å se deg igjen.</p>
    <form id="login-form">
      <label class="field-label" for="login-id">Brukernavn eller e-post</label>
      <input class="text-input" id="login-id" type="text" required>

      <label class="field-label" for="login-password">Passord</label>
      <div class="password-field">
        <input class="text-input" id="login-password" type="password" required>
        <button type="button" class="password-toggle" data-target="login-password" aria-label="Vis passord">
          <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" hidden>
            <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 5.14A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a13.2 13.2 0 0 1-3.22 4.06M6.2 6.2C3.7 7.9 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.16 3.3-.45" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <p class="field-error" id="login-error" hidden>Fant ingen konto med disse opplysningene.</p>

      <button type="submit" class="btn btn-primary btn-lg auth-submit">Logg inn</button>
    </form>
    <p class="auth-switch">Har du ikke konto ennå? <a href="registrer.html">Registrer deg</a></p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
